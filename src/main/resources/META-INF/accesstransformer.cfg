# Access transformer for Applied Enhancements (loaded by NeoForge from this default path;
# ModDevGradle applies it to the dev Minecraft artifact automatically).
#
# MC 26 made AbstractContainerScreen.imageWidth/imageHeight final (set once via the constructor).
# AelisCraftConfirmScreen resizes itself while open (window resize, graph fullscreen toggle), so it
# needs them writable. These are the same two lines AE2 26.1.13 ships for the same reason.
protected-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
protected-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight
