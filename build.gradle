plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // https://projects.neoforged.net/neoforged/ModDevGradle
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // AE2 26.x is published to Maven Central (no longer to modmaven).
    mavenCentral()
    mavenLocal()
    maven {
        name = 'Modmaven (K4U-NL)'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Progwml6 (JEI)'
        url = 'https://dvs1.progwml6.com/files/maven/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.1 runs on Java 25 (FTB Evolution 2 ships Java 25), so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

neoForge {
    // Specify the version of NeoForge to use (replaces the NeoGradle
    // `implementation "net.neoforged:neoforge:..."` dependency).
    version = project.neo_version
    // Parchment is configured in gradle.properties (neoForge.parchment.*).

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            // Keep development output concise; enable detailed logging when investigating an issue.
            systemProperty 'forge.logging.console.level', 'info'
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the game directory, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    // Which source sets belong to which mod (replaces NeoGradle's `modSource`).
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // MC 26 / FML 11: tests that bootstrap Minecraft need a real FML loader (FMLLoader.getCurrent()).
    // MDG's unitTest mode starts one via junit-fml for the `test` task, and also puts Minecraft/NeoForge
    // on the test classpath. Only tests tagged "fml" run there; all others run in `plainTest` below.
    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NeoForge/Minecraft come from `neoForge { version = ... }` above (ModDevGradle).

    // AE2 - required dependency
    // Public extension APIs expose AE2 types such as KeyCounter and IPatternDetails.
    api "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // JEI is optional at runtime. The full compile artifact is used by the
    // isolated client integration so cheat actions follow JEI's own mode,
    // permission synchronization and give behavior.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (!project.hasProperty('withoutJei')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // MixinExtras: the runtime (mixinextras-neoforge 0.5.5) ships with NeoForge
    // 26.1.2.126, so only the annotation processor is declared here, at the same version.
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.5'
    // NeoForge provides MixinExtras only for compiling and inside the game (FML loads it at startup).
    // Plain JUnit tests need it on their runtime classpath; same version as NeoForge 26.1.2.126 ships.
    testRuntimeOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.5'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // NeoForge test framework: EphemeralTestServerProvider starts a short-lived in-memory server so
    // item data components and tags are bound in MC 26 (same setup as AE2 26.1.13's tests).
    testImplementation "net.neoforged:testframework:${neo_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    // Keep editor backups and development artifacts out of runtime resources.
    exclude '**/*.bak', '**/*.old', '**/*.orig', '**/*.rej', '**/*.tmp', '**/*.log', '**/*~',
            '**/*.bbmodel', '**/*.psd', '**/*.xcf', '**/*.blend',
            '**/.DS_Store', '**/Thumbs.db', '**/desktop.ini'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            ae2_version            : ae2_version,
            ae2_version_range      : ae2_version_range,
            extendedae_version_range: extendedae_version_range,
            ae2wtlib_version_range : ae2wtlib_version_range,
            jei_version_range      : jei_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(layout.projectDirectory.dir('repo'))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:deprecation')
    // Show every compile error instead of stopping at javac's default of 100.
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

// Test classes that need a started FML/Minecraft environment (MC 26 / FML 11). They are also
// tagged @Tag("fml"), but JUnit must LOAD a class to read its tags, and some other test classes
// (Mixin inspection) cannot be loaded inside FML. So select them by file name first.
// Adding a new FML test = @Tag("fml") on the class + an entry here.
def fmlTestClasses = [
        'com/github/appliedenhancements/crafting/aelis/AelisExactCyclicPlanningTest*',
        'com/github/appliedenhancements/crafting/aelis/AelisFixedRemainderPlanningTest*',
        'com/github/appliedenhancements/crafting/aelis/AelisFixedRemainderTest*',
        // Force-loads every Mixin target so each Mixin is really applied (see the class comment).
        'com/appliedenhancements/test/MixinApplyAuditTest*',
]

// `test`: only the FML tests; they run inside a started FML environment (see neoForge.unitTest).
tasks.named('test', Test).configure {
    include fmlTestClasses
    useJUnitPlatform {
        includeTags 'fml'
    }
}

// `plainTest`: every other test as plain JUnit, exactly like before the port (no FML started).
def plainTest = tasks.register('plainTest', Test) {
    description = 'Runs the unit tests that do not need a started FML/Minecraft environment.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    // junit-fml would start FML in this JVM too, so it is left out of this task's classpath.
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('junit-fml') }
    exclude fmlTestClasses
    useJUnitPlatform {
        excludeTags 'fml'
    }
}
tasks.named('check') {
    dependsOn plainTest
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Ship current source documentation, while generated JavaDoc remains a build artifact.
tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE')
    from('docs') {
        include 'API_INTEGRATION.md', 'API_INTEGRATION_ZH.md', 'BATCH_EXECUTION_API.md',
                'EXACT_CRAFTING_API.md'
        into 'docs'
    }
}

tasks.register('apiJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generate public planning, batch, storage and client integration API docs.'
    dependsOn tasks.named('classes')
    source = sourceSets.main.java.matching {
        include 'com/appliedenhancements/api/**/*.java'
    }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = layout.buildDirectory.dir('docs/api').get().asFile
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PUBLIC
    options.addBooleanOption('Xdoclint:none', true)
    options.windowTitle = "Applied Enhancements ${mod_version} API"
}
